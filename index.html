<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Moon Cresta</title>
<meta name="description" content="Moon Cresta, el arcade de 1980, en versión web: tres segmentos de cohete, maniobra de acoplamiento y diez oleadas por ronda. Se juega en el navegador, sin instalar nada.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Moon Cresta Arcade">
<meta property="og:description" content="El clásico de 1980 en tu navegador: acopla los tres segmentos MCX y multiplica tu potencia de fuego.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Moon Cresta Arcade">
<meta name="twitter:description" content="El clásico de 1980 en tu navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Courier New",monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  canvas{background:#000;image-rendering:pixelated;box-shadow:0 0 40px rgba(255,120,40,.22)}
  #pad{display:none;width:100%;max-width:480px;justify-content:space-between;padding:8px 12px;box-sizing:border-box;gap:8px}
  #pad button{flex:1;height:64px;font:bold 15px monospace;color:#fff;background:#2a1208;border:2px solid #d0632a;border-radius:10px}
  #pad button:active{background:#d0632a}
  @media (pointer:coarse){#pad{display:flex}}
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<div id="pad">
  <button data-k="left">◀</button>
  <button data-k="right">▶</button>
  <button data-k="shield" id="padShield" style="display:none">BARRERA</button>
  <button data-k="fire">FUEGO</button>
</div>
<script>
const W = 480, H = 640, PX = 3;             // rejilla de "píxeles gordos" como en el monitor vertical de la recreativa
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Press Start 2P","Courier New",monospace';
try { document.fonts.load('16px "Press Start 2P"'); } catch (e) {}

// ---------- Entrada ----------
const keys = {}, touch = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowLeft','ArrowRight','ArrowDown','ArrowUp'].includes(e.code)) e.preventDefault();
  if (!e.repeat) onKey(e.code);
});
addEventListener('keyup', e => keys[e.code] = false);
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); touch[k] = true; initAudio(); if (state === 'title' || state === 'over') startGame(false); });
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => touch[k] = false));
});
const inLeft = () => keys.ArrowLeft || keys.KeyA || touch.left;
const inRight = () => keys.ArrowRight || keys.KeyD || touch.right;
// El botón de fuego hace doble servicio: dispara en juego y es el retrocohete en el acoplamiento.
const inFire = () => keys.Space || keys.ArrowUp || keys.KeyW || touch.fire;
const inShield = () => keys.ArrowDown || keys.KeyS || keys.ShiftLeft || keys.ShiftRight || touch.shield;

let scan = true, skill = 1;                 // 0 fácil, 1 normal, 2 difícil (los tres niveles del manual)
const SKILL_NAME = ['FACIL', 'NORMAL', 'DIFICIL'];
// Dos añadidos que no están en la recreativa, elegibles en el título.
let shieldOpt = false;                      // barrera estilo Phoenix
let keepDock = false;                       // al morir conservas la nave acoplada
try { shieldOpt = localStorage.getItem('mcShield') === '1'; keepDock = localStorage.getItem('mcKeep') === '1'; } catch (e) {}
function saveOpts() { try { localStorage.setItem('mcShield', shieldOpt ? '1' : '0'); localStorage.setItem('mcKeep', keepDock ? '1' : '0'); } catch (e) {} }
function onKey(code) {
  initAudio();
  if (code === 'KeyM') muted = !muted;
  if (code === 'KeyC') scan = !scan;
  if (state === 'title') {
    if (code === 'Enter' || code === 'Space') startGame(false);
    else if (code === 'KeyI') startGame(true);
    else if (code === 'KeyD') startDockTest();
    else if (code === 'KeyE') { shieldOpt = !shieldOpt; saveOpts(); }
    else if (code === 'KeyR') { keepDock = !keepDock; saveOpts(); }
    else if (code === 'ArrowLeft') skill = (skill + 2) % 3;
    else if (code === 'ArrowRight') skill = (skill + 1) % 3;
  } else if (state === 'dock' && dockLoop && code === 'Enter') { dockLoop = 0; dock = null; state = 'title'; }
  else if (state === 'over' && (code === 'Enter' || code === 'Space') && overT <= 0) state = 'title';
  else if (code === 'KeyP' || code === 'Escape') { if (state === 'play' || state === 'dock') state = 'paused'; else if (state === 'paused') state = prevState; }
}

// ---------- Sprites (píxel art) ----------
function mk(rows, pal, flip) {
  const w = Math.max(...rows.map(r => r.length)), c = document.createElement('canvas');
  c.width = w; c.height = rows.length; const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(flip ? w - 1 - x : x, y, 1, 1); } }));
  return c;
}
function drawSpr(c, x, y, s = PX) {
  const w = c.width * s, h = c.height * s;
  ctx.drawImage(c, Math.round((x - w / 2) / PX) * PX, Math.round((y - h / 2) / PX) * PX, w, h);
}
// La mitad izquierda se refleja para que el bicho salga simétrico.
const mirror = f => f.map(l => l + [...l].reverse().join('').slice(1));

// Los tres segmentos del cohete, tal y como se apilan en la portada: MCX-1 arriba, MCX-3 abajo.
const F1 = [
  '....W....', '....W....', '...WBW...', '...WBW...', '..WWBWW..', '..WWBWW..',
  '..WWBWW..', '.RWWBWWR.', 'RRWWBWWRR', 'RRWWWWWRR', 'R.W.W.W.R', '...Y.Y...'];
const F2 = [
  '......W......', '......W......', '.....WBW.....', '.....WBW.....', '....WWBWW....', '....WWBWW....',
  '...WWWBWWW...', '..WWWWBWWWW..', '.WWWWWBWWWWW.', 'WWCWWWBWWWCWW', 'WWCWWWBWWWCWW', 'WWWWWWBWWWWWW',
  'RWWWWWBWWWWWR', 'RRWWWWBWWWWRR', 'RRRWWWBWWWRRR', 'RR.WWWWWWW.RR', 'R...W.W.W...R', '.....Y.Y.....'];
const F3 = [
  '.......W.......', '.......W.......', '......WBW......', '......WBW......', '.....WWBWW.....', '.....WWBWW.....',
  '....WWWBWWW....', '...WWWWBWWWW...', '..WWWWWBWWWWW..', '..WCWWWBWWWCW..', '..WCWWWBWWWCW..', '..WWWWWBWWWWW..',
  '.WWWWWWBWWWWWW.', '.WWWWWWBWWWWWW.', 'WWCWWWWBWWWWCWW', 'WWCWWWWBWWWWCWW', 'WWWWWWWBWWWWWWW', 'RWWWWWWBWWWWWWR',
  'RRWWWWWBWWWWWRR', 'RRRWWWWBWWWWRRR', 'RRRRWWWWWWWRRRR', 'RR..WWWWWWW..RR', 'R....W.W.W....R', '......Y.Y......'];
// Los segmentos sueltos: lo que te espera flotando en la maniobra de acoplamiento.
const S2 = [
  '.....WWW.....', '....WWBWW....', '...WWWBWWW...', '..WWWWBWWWW..', '.WWWWWBWWWWW.',
  'WWCWWWBWWWCWW', 'WWCWWWBWWWCWW', 'WWWWWWBWWWWWW', 'RWWWWWBWWWWWR', 'RR.WWWWWWW.RR'];
const S3 = [
  '......WWW......', '.....WWBWW.....', '....WWWBWWW....', '...WWWWBWWWW...', '..WWWWWBWWWWW..',
  '.WWCWWWBWWWCWW.', 'WWWCWWWBWWWCWWW', 'WWWWWWWBWWWWWWW', 'RWWWWWWBWWWWWWR', 'RR..WWWWWWW..RR'];
const SHIP_PAL = { W: '#e6ebff', B: '#2d6cff', C: '#ff2a2a', R: '#c0182a', Y: '#ffd23a' };

// Oleadas 1-2: el bicho que se parte en dos mitades (50 puntos cada mitad).
const E_SPLIT = [
  ['AA....', 'AAA...', '.AAA..', '..AA.B', '...BBB', '..BBWB', '...BBB', '....B.'],
  ['.A....', 'AAA...', '.AAAA.', '..AAB.', '...BBB', '..BBWB', '...BBB', '....B.']];
// Oleadas 3-4: el enjambre de moscas (30 puntos).
const E_FLY = [
  ['A....', '.A...', 'AA..B', 'AAA.B', '.AABB', '...BB', '..BWB', '...B.'],
  ['.....', 'A..B.', 'AA.BB', '.AABB', '..ABB', '...BB', '..BWB', '...B.']];
// Oleadas 5-6: el peine que se desvanece y reaparece (60 puntos).
const E_FAN = [
  ['A.A.A', 'A.A.A', 'A.A.A', 'AAABB', '.ABBB', '..BBW', '..BBB', '...B.', '...C.'],
  ['.A.A.', 'A.A.A', 'A.A.A', 'AAABB', '.ABBB', '..BBW', '..BBB', '...B.', '..C.C']];
// Oleadas 7-8: el bicho compacto que se transforma en misil y cae a plomo (100 puntos).
const E_POD = ['..BBB..', '.BBBBB.', 'BBWBWBB', '.BBBBB.', '..BBB..', '.......', '.......'];
const E_MIS = ['...W...', '..WBW..', '..BBB..', '..BBB..', '..BCB..', '.C.B.C.', '..C.C..'];
// Oleadas 9-10: la tormenta de meteoritos (200 puntos).
const E_ROCK = [
  ['..AAAA..', '.AAAABA.', 'AABAAAAA', 'AAAAAABA', 'ABAAAAAA', 'AAAABAAA', '.AAAAAA.', '..AAAA..'],
  ['..AAAA..', '.AABAAA.', 'AAAAABAA', 'ABAAAAAA', 'AAAAABAA', 'AABAAAAA', '.AAAAAA.', '..AAAA..']];

const spr = {
  f: [mk(F1, SHIP_PAL), mk(F2, SHIP_PAL), mk(F3, SHIP_PAL)],
  s: [mk(S2, SHIP_PAL), mk(S3, SHIP_PAL)],
  icon: mk(['..W..', '.WBW.', 'WWBWW', 'R.W.R'], SHIP_PAL),
  split: E_SPLIT.map(f => mk(mirror(f), { A: '#ff4ad0', B: '#ffe400', W: '#ffffff' })),
  // Cada mitad vuela por su cuenta: la izquierda es el sprite tal cual, la derecha el mismo reflejado.
  halfL: E_SPLIT.map(f => mk(f, { A: '#ff4ad0', B: '#ffe400', W: '#ffffff' })),
  halfR: E_SPLIT.map(f => mk(f, { A: '#ff4ad0', B: '#ffe400', W: '#ffffff' }, true)),
  fly: E_FLY.map(f => mk(mirror(f), { A: '#39f0ff', B: '#ff6a00', W: '#ffffff' })),
  fan: E_FAN.map(f => mk(mirror(f), { A: '#9d7bff', B: '#00e676', C: '#ffe400', W: '#ffffff' })),
  pod: mk(E_POD, { B: '#ff2a6a', W: '#ffffff' }),
  mis: mk(E_MIS, { B: '#ffe400', C: '#ff6a00', W: '#ffffff' }),
  rock: E_ROCK.map(f => mk(f, { A: '#b8864a', B: '#6b4420' })),
};

// ---------- Audio (síntesis analógica estilo placa) ----------
let ac = null, muted = false, mus = null, hum = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(type, f1, f2, dur, vol = 0.08) {
  if (!ac || muted) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol = 0.2, f1 = 4000, f2 = 200, type = 'lowpass') {
  if (!ac || muted) return;
  const t = ac.currentTime, n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; f.type = type; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(Math.max(f2, 20), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t);
}
function organ(f, dur) { tone('triangle', f, f, dur, 0.1); tone('square', f, f, dur, 0.025); }
// Zumbido de la barrera, igual que en Phoenix: sube de tono según se le acaba la carga.
function shieldHum(on, energy) {
  if (!ac || muted) on = false;
  if (on && !hum) {
    const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
    o.type = 'sawtooth'; o.frequency.value = 180; l.frequency.value = 9; lg.gain.value = 40; g.gain.value = 0.05;
    l.connect(lg).connect(o.frequency); o.connect(g).connect(ac.destination); o.start(); l.start(); hum = { o, l };
  } else if (!on && hum) { try { hum.o.stop(); hum.l.stop(); } catch (e) {} hum = null; }
  if (hum) hum.o.frequency.value = 180 + (1 - energy) * 220;
}
const N = { C4: 261.6, E4: 329.6, G4: 392, A4: 440, B4: 493.9, C5: 523.3, D5: 587.3, E5: 659.3, G5: 784, A5: 880, C6: 1046.5 };
// Fanfarria de arranque: una escala ascendente de tres notas por compás, como el tema de la recreativa.
const FANFARE = [[N.C4,1],[N.E4,1],[N.G4,1],[N.C5,2],[N.G4,1],[N.C5,1],[N.E5,1],[N.G5,2],
  [N.E5,1],[N.D5,1],[N.C5,1],[N.D5,2],[N.E5,1],[N.G5,1],[N.C6,3]];
function playMusic(notes, unit) { mus = { notes, i: 0, t: 0, unit }; }
function updateMusic(dt) {
  if (!mus) return; mus.t -= dt;
  if (mus.t <= 0) {
    const n = mus.notes[mus.i]; if (!n) { mus = null; return; }
    organ(n[0], n[1] * mus.unit * 0.95); mus.t = n[1] * mus.unit; mus.i++;
  }
}
const sfx = {
  shoot: () => { tone('square', 2100, 560, 0.09, 0.04); noise(0.04, 0.03, 5200, 2000, 'bandpass'); },
  enemyShoot: () => tone('square', 580, 170, 0.11, 0.028),
  kill: () => { noise(0.2, 0.2, 4400, 1100, 'bandpass'); tone('sawtooth', 1850, 290, 0.17, 0.045); },
  split: () => { tone('square', 900, 1800, 0.08, 0.045); setTimeout(() => tone('square', 1800, 1100, 0.08, 0.04), 70); },
  rock: () => { noise(0.3, 0.24, 2200, 300, 'lowpass'); tone('sawtooth', 420, 90, 0.3, 0.05); },
  death: () => { noise(1.7, 0.3, 4000, 400, 'bandpass'); tone('sawtooth', 1800, 190, 1.7, 0.1); },
  wave: () => { tone('square', 330, 330, 0.12); setTimeout(() => tone('square', 440, 440, 0.12), 130); setTimeout(() => tone('square', 660, 660, 0.25), 260); },
  // El pitido del contador de acoplamiento, uno por segundo mientras corre el reloj.
  tick: () => tone('square', 1200, 1200, 0.03, 0.02),
  thrust: () => tone('sawtooth', 90, 130, 0.08, 0.03),
  dockOk: () => [0, 110, 220, 330, 480].forEach((d, i) => setTimeout(() => organ([N.C5, N.E5, N.G5, N.C6, N.G5][i], 0.2), d)),
  dockFail: () => { noise(0.6, 0.28, 3000, 220, 'lowpass'); tone('sawtooth', 700, 70, 0.6, 0.08); },
  extra: () => [0, 90, 180].forEach((d, i) => setTimeout(() => organ([N.G5, N.C6, N.E5 * 2][i], 0.14), d)),
  phase: () => tone('sine', 1500, 300, 0.18, 0.03),
  shield: () => tone('sawtooth', 120, 500, 0.2, 0.05),
  bounce: () => tone('square', 1400, 2400, 0.06, 0.035),
};

// ---------- Estado ----------
let state = 'title', prevState = 'play', score = 0, hi = 0, T = 0, overT = 0, infinite = false;
let round = 0, waveIdx = 0, stack = 3, parts = 1, extraGiven = false;
// Modo de prueba: encadena acoplamientos sin parar, recorriendo los tres multiplicadores del manual.
let dockLoop = 0, dockCycle = 0;
const DOCK_TEST = [[1, 3], [2, 7], [1, 8]];   // [segmentos en vuelo, oleada] -> x100, x300 y x200
try { hi = +localStorage.getItem('mooncrestaHi') || 0; } catch (e) {}
let P, shots = [], ebul = [], enemies = [], parts_ = [], pops = [], msg = '', msgT = 0, clearT = 0, fireT = 0, diveT = 0, spawnT = 0, spawned = 0;
let dock = null;

// Mismo cielo que en Phoenix: azules apagados, para que no compitan con el láser enemigo.
const stars = Array.from({ length: 420 }, () => { const r = Math.random(); return {
  x: Math.floor(Math.random() * W / PX) * PX, y: Math.random() * H, s: 34 + Math.random() * 40,
  ty: r < 0.955 ? 0 : r < 0.99 ? 1 : 2, ph: Math.random() * 6 }; })
  .map(s => (s.ty >= 2 ? (s.s = 73) : 0, s));
function drawStar(s) {
  const y = Math.round(s.y / PX) * PX;
  if (s.ty === 0) {                       // el cielo: carpeta densa de puntos azules apagados
    const k = Math.sin(T * 2.2 + s.ph);
    if (k < -0.8) return;
    ctx.fillStyle = k > 0.88 ? '#4a5ce8' : k > 0.2 ? '#2a3ad0' : '#1b27a8';
    ctx.fillRect(s.x, y, PX, PX);
  } else if (s.ty === 1) {                // punto brillante que titila, sin cruz
    ctx.fillStyle = Math.sin(T * 5 + s.ph) > 0.1 ? '#cdd6ff' : '#6a78c8';
    ctx.fillRect(s.x, y, PX, PX);
  } else {                                // mancha de nebulosa, muy tenue
    ctx.fillStyle = '#131f88'; ctx.beginPath(); ctx.arc(s.x, y, 4, 0, 6.283); ctx.fill();
  }
  // De Phoenix se queda fuera el destello en cruz: tiene la misma forma que la bala enemiga.
}

// ---------- Reglas de la ronda ----------
// Diez oleadas por ronda, en parejas, y acoplamiento tras la 4ª y la 8ª (manual del 7800).
const KIND = [0, 0, 1, 1, 2, 2, 3, 3, 4, 4];     // 0 partible, 1 mosca, 2 peine, 3 misil, 4 meteorito
const COUNT = [4, 8, 8, 8, 16];
const VALUE = [50, 30, 60, 100, 200];
const kind = () => KIND[waveIdx];
// Velocidad: sube con la ronda y con el nivel elegido.
const diff = () => (0.82 + skill * 0.14) * (1 + round * 0.12);
const shipH = () => spr.f[parts - 1].height * PX;
const shipHW = () => spr.f[parts - 1].width * PX / 2 - 3;

function startGame(inf) {
  infinite = !!inf; dockLoop = 0;
  document.getElementById('padShield').style.display = shieldOpt ? '' : 'none';
  score = 0; round = 0; waveIdx = 0; stack = 3; parts = 1; extraGiven = false;
  ebul = []; shots = []; parts_ = []; pops = []; overT = 0; dock = null;
  newShip(1.5);
  state = 'play'; startWave();
  playMusic(FANFARE, 0.13);
}
const SH_TIME = 1.6, SH_COOL = 5;                  // duración de la barrera y espera antes de reutilizarla
function newShip(inv) {
  P = { x: W / 2, y: 614 - shipH() / 2, alive: true, inv, cd: 0, respawn: 0, shOn: false, shT: 0, cool: 0 };
}
// Con la opción de conservar el acople, un impacto cuesta una nave y punto: sigues volando igual de grande.
const canDock = () => parts < 3 && (keepDock || stack - parts > 0);

function startWave() {
  enemies = []; ebul = []; shots = []; spawned = 0;
  const k = kind();
  spawnT = 0.6; fireT = 2; diveT = 2.6 - Math.min(1.2, round * 0.25);
  msg = k === 4 ? 'TORMENTA DE METEORITOS' : 'OLEADA ' + (waveIdx + 1); msgT = 1.8; clearT = 0;
  sfx.wave();
}

// Un enemigo nuevo entra desde arriba siguiendo una ese y luego se coloca en formación.
function mkEnemy(k, i, n) {
  const cols = Math.min(8, n), col = i % cols, row = Math.floor(i / cols);
  const e = { k, hp: 1, st: 'enter', t: 0, half: 0, flap: Math.random() * 6, dir: Math.random() < 0.5 ? -1 : 1,
    hx: (col - (cols - 1) / 2) * 52, hy: 110 + row * 46, x: W / 2 + (i % 2 ? -1 : 1) * 30, y: -30, vis: 1, morph: 0 };
  if (k === 4) {                                   // los meteoritos no forman: caen en diagonal y punto
    e.st = 'rock'; e.x = 30 + Math.random() * (W - 60); e.y = -20;
    e.vx = (Math.random() < 0.5 ? -1 : 1) * (50 + Math.random() * 70); e.vy = 130 + Math.random() * 60;
  }
  return e;
}

// ---------- Utilidades ----------
const SPARK = ['#fff', '#ff2', '#f82', '#f33'];
function boom(x, y, n, col, big) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = (big ? 40 : 20) + Math.random() * (big ? 200 : 110);
    parts_.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.6, col: col || SPARK[i % 4] });
  }
}
function addScore(n) {
  score += n;
  if (!extraGiven && score >= 30000) { extraGiven = true; stack += 3; sfx.extra(); pops.push({ x: W / 2 - 60, y: 300, text: '+3 NAVES', life: 1.6 }); }
  if (score > hi) { hi = score; try { localStorage.setItem('mooncrestaHi', hi); } catch (e) {} }
}
function pop(x, y, n) { pops.push({ x, y, text: String(n), life: 0.9 }); }

// Un impacto destruye la nave entera: vuelves a volar con un solo segmento.
function hitPlayer() {
  if (!P.alive || P.inv > 0 || P.shOn) return;
  P.alive = false; P.respawn = 2; P.shOn = false;
  boom(P.x, P.y, 60, null, true); boom(P.x, P.y, 25, '#6cf', true); sfx.death();
  if (!infinite) stack -= keepDock ? 1 : parts;
  if (!keepDock) parts = 1;
  if (stack <= 0 && !infinite) overT = 2.5;
}

// ---------- Acoplamiento ----------
// Tras la 4ª y la 8ª oleada, si queda algún segmento en reserva, hay 30 s para acoplarlo.
const DOCK_TOL = 11;                               // margen de alineación, en píxeles a cada lado
function startDock() {
  const seg = parts === 1 ? 0 : 1;                 // 0: MCX-2, 1: MCX-3
  // El manual tarifa los tres casos: I con II/III a 100, II con III a 200, I+II con III a 300.
  const mult = parts === 2 ? 300 : (waveIdx > 4 ? 200 : 100);
  dock = { seg, mult, time: 30, tick: 1, x: W / 2, t: 0, spd: 0.55 + round * 0.1 + skill * 0.12, done: 0, doneT: 0 };
  P.x = W / 2; P.y = 614 - shipH() / 2; P.alive = true; P.inv = 0;
  state = 'dock'; msg = 'ACOPLAMIENTO'; msgT = 1.8;
}
function endDock() {
  if (dockLoop) {                                  // en el bucle de prueba se enlaza con el siguiente
    dockCycle = (dockCycle + 1) % DOCK_TEST.length;
    dock = null; applyDockTest(); return;
  }
  dock = null; state = 'play'; nextWave(true);
}
function applyDockTest() {
  [parts, waveIdx] = DOCK_TEST[dockCycle];
  stack = 3; enemies = []; spawned = 99; ebul = []; shots = [];
  newShip(0); startDock();
}
function startDockTest() {
  infinite = true; dockLoop = 1; dockCycle = 0; extraGiven = true;
  score = 0; round = 0; parts_ = []; pops = []; overT = 0;
  applyDockTest();
}

function updateDock(dt) {
  const d = dock;
  d.t += dt;
  d.x = W / 2 + Math.sin(d.t * d.spd) * 150;
  if (d.done) {                                    // pequeña pausa para que se vea el enganche o el fogonazo
    d.doneT -= dt; if (d.doneT <= 0) endDock();
    return;
  }
  d.time -= dt; d.tick -= dt;
  if (d.tick <= 0) { d.tick = 1; sfx.tick(); }
  if (d.time <= 0) { d.time = 0; d.done = 2; d.doneT = 1.2; msg = 'SIN ACOPLAR'; msgT = 1.6; return; }

  const dx = (inRight() ? 1 : 0) - (inLeft() ? 1 : 0);
  P.x = Math.max(24, Math.min(W - 24, P.x + dx * 230 * dt));
  // El botón de fuego es el retrocohete; al soltarlo la nave cae despacio.
  if (inFire()) { P.y -= 165 * dt; if (Math.random() < 0.35) sfx.thrust(); }
  else P.y += 70 * dt;
  P.y = Math.max(150, Math.min(614 - shipH() / 2, P.y));

  const seg = spr.s[d.seg], segH = seg.height * PX, segY = 230;
  // Se acopla cuando el morro alcanza la base del segmento; el margen de alineación es de 11 px.
  if (P.y - shipH() / 2 <= segY + segH / 2 && P.y - shipH() / 2 > segY - segH) {
    if (Math.abs(P.x - d.x) <= DOCK_TOL) {
      const secs = Math.ceil(d.time), bonus = secs * d.mult;
      addScore(bonus); pop(W / 2 - 50, 320, bonus);
      parts++; P.inv = 1.5;
      d.done = 1; d.doneT = 1.6; msg = 'ACOPLADO  +' + bonus; msgT = 1.6; sfx.dockOk();
    } else {
      // Mal alineado: el segmento con el que ibas a acoplar se destruye.
      boom(d.x, segY, 50, null, true); sfx.dockFail();
      if (!infinite) stack--;
      d.done = 2; d.doneT = 1.4; msg = 'SEGMENTO PERDIDO'; msgT = 1.6;
      if (stack <= 0 && !infinite) { state = 'over'; overT = 1.2; dock = null; }
    }
  }
}

// ---------- Avance de oleada ----------
function nextWave(afterDock) {
  // Acoplamiento tras la 4ª y la 8ª, sólo si hay segmento en reserva.
  if (!afterDock && (waveIdx === 3 || waveIdx === 7) && canDock() && P.alive) {
    waveIdx++; startDock(); return;
  }
  if (!afterDock) waveIdx++;
  if (waveIdx >= 10) { waveIdx = 0; round++; }
  startWave();
}

// ---------- Actualización ----------
function update(dt) {
  T += dt;
  for (const s of stars) { s.y += s.s * dt; if (s.y > H) { s.y = 0; s.x = Math.floor(Math.random() * W / PX) * PX; } }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].life -= dt; if (pops[i].life <= 0) pops.splice(i, 1); }
  for (let i = parts_.length - 1; i >= 0; i--) {
    const p = parts_[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) parts_.splice(i, 1);
  }
  if (msgT > 0) msgT -= dt;
  if (state !== 'play') shieldHum(false);
  if (state === 'over') { overT -= dt; return; }
  if (state === 'dock') { updateMusic(dt); updateDock(dt); updatePlayerShots(dt, true); return; }
  if (state !== 'play') return;
  updateMusic(dt);

  // Jugador
  if (P.alive) {
    P.inv -= dt; P.cd -= dt; P.cool -= dt;
    // La barrera dura un instante, clava la nave en el sitio y luego tarda ~5 s en recargarse.
    if (shieldOpt) {
      if (P.shOn) {
        P.shT -= dt;
        if (P.shT <= 0 || !inShield()) { P.shOn = false; P.cool = SH_COOL; }
      } else if (inShield() && P.cool <= 0) { P.shOn = true; P.shT = SH_TIME; sfx.shield(); }
      shieldHum(P.shOn, Math.max(0, P.shT / SH_TIME));
    }
    if (!P.shOn) {                                  // con la barrera activa no se puede mover
      const dx = (inRight() ? 1 : 0) - (inLeft() ? 1 : 0);
      P.x = Math.max(shipHW(), Math.min(W - shipHW(), P.x + dx * 250 * dt));
    }
    P.y = 614 - shipH() / 2;
    // Cada segmento acoplado suma dos cañones: 1, 3 y 5 láseres.
    if (inFire() && P.cd <= 0 && !P.shOn && shots.length < parts * 2 + 2) {
      const n = parts * 2 - 1, top = P.y - shipH() / 2;
      for (let i = 0; i < n; i++) shots.push({ x: P.x + (i - (n - 1) / 2) * 13, y: top + 4 });
      P.cd = 0.2; sfx.shoot();
    }
  } else {
    shieldHum(false);
    if (stack > 0 || infinite) {
      P.respawn -= dt;
      if (P.respawn <= 0) { newShip(2); }
    } else if (overT <= 0) { state = 'over'; overT = 1.2; return; }
    else overT -= dt;
  }

  updatePlayerShots(dt, false);
  updateEnemies(dt);

  // Balas enemigas
  for (let i = ebul.length - 1; i >= 0; i--) {
    const b = ebul[i]; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 10 || b.y < -20 || b.x < -10 || b.x > W + 10) { ebul.splice(i, 1); continue; }
    if (P.alive && P.shOn && Math.abs(b.x - P.x) < shipHW() + 12 && Math.abs(b.y - P.y) < shipH() / 2 + 10) {
      boom(b.x, b.y, 6, '#8ff'); sfx.bounce(); ebul.splice(i, 1); continue;   // la barrera las desintegra
    }
    if (P.alive && Math.abs(b.x - P.x) < shipHW() && Math.abs(b.y - P.y) < shipH() / 2) { ebul.splice(i, 1); hitPlayer(); }
  }

  // Fin de oleada: no quedan enemigos ni por salir
  if (P.alive && enemies.length === 0 && spawned >= COUNT[kind()]) {
    clearT += dt;
    if (clearT > 1.6) { clearT = 0; nextWave(false); }
  }
}

function updatePlayerShots(dt, dockMode) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const b = shots[i], py = b.y; b.y -= 640 * dt;
    let dead = b.y < -10;
    if (!dead && !dockMode) for (const e of enemies) {
      if (e.st === 'enter' && e.y < 0) continue;
      if (e.vis < 1) continue;                      // al peine no se le puede dar mientras está desvanecido
      const hw = hwOf(e), hh = hhOf(e);
      if (Math.abs(b.x - e.x) < hw && b.y < e.y + hh && py > e.y - hh) { dead = true; hurt(e); break; }
    }
    if (dead) shots.splice(i, 1);
  }
  enemies = enemies.filter(e => e.hp > 0);
}

const hwOf = e => e.k === 0 ? (e.half ? 9 : 16) : e.k === 1 ? 13 : e.k === 2 ? 13 : e.k === 3 ? 10 : 12;
const hhOf = e => e.k === 0 ? 12 : e.k === 1 ? 12 : e.k === 2 ? 13 : e.k === 3 ? 10 : 12;

function hurt(e) {
  if (e.hp <= 0) return;                     // ya estaba muerto en este mismo fotograma
  // Oleadas 1-2: el primer impacto lo parte en dos mitades que siguen volando por su cuenta.
  if (e.k === 0 && !e.half) {
    e.hp = 0; sfx.split(); boom(e.x, e.y, 10, '#ff4ad0');
    for (const s of [-1, 1]) {
      enemies.push({ ...e, hp: 1, half: s, st: 'dive', t: 0, dir: s, x: e.x + s * 14, y: e.y,
        hx: e.hx + s * 26, vx: s * 70, vis: 1 });
    }
    return;
  }
  e.hp = 0;
  const v = VALUE[e.k];
  addScore(v); pop(e.x + 14, e.y + 6, v);
  boom(e.x, e.y, e.k === 4 ? 30 : 20, e.k === 4 ? '#c89' : null, e.k === 4);
  e.k === 4 ? sfx.rock() : sfx.kill();
}

// A dónde vuelve un enemigo que se ha salido por abajo, según el nivel de dificultad.
function reenter(e) {
  const r = Math.random();
  e.t = 0;
  if (skill === 0 || r > [1, 0.5, 0.25][skill]) {   // fácil: reaparece arriba, en el centro
    e.st = 'enter'; e.x = W / 2 + (Math.random() - 0.5) * 60; e.y = -30;
  } else {                                          // normal y difícil: asoma por debajo, bajo la nave
    e.st = 'under'; e.y = H + 25; e.x = skill === 2 && P.alive ? P.x : 40 + Math.random() * (W - 80);
  }
}

function updateEnemies(dt) {
  const d = diff(), k = kind(), total = COUNT[k];
  // Entrada escalonada: van apareciendo de uno en uno por arriba.
  spawnT -= dt;
  if (spawnT <= 0 && spawned < total) {
    enemies.push(mkEnemy(k, spawned, total)); spawned++;
    spawnT = k === 4 ? 0.55 / d : 0.32;
  }
  // El último superviviente se vuelve loco a partir de la segunda ronda.
  const berserk = round > 0 && enemies.length === 1 ? 2 : 1;
  const sway = Math.sin(T * 0.75) * 34, bob = Math.sin(T * 1.4) * 7;

  for (const e of enemies) {
    const sp = d * berserk;
    e.t += dt;
    const tx = W / 2 + e.hx + sway, ty = e.hy + bob;
    if (e.st === 'rock') {
      e.x += e.vx * sp * dt; e.y += e.vy * sp * dt;
      if (e.x < 14 || e.x > W - 14) e.vx *= -1;
      if (e.y > H + 20) { e.hp = 0; }               // el que se escapa no puntúa, sólo deja de estorbar
    } else if (e.st === 'enter') {
      // Baja trazando una ese hasta su hueco en la formación.
      e.y += 200 * sp * dt;
      e.x = tx + Math.sin(e.t * 3.4) * 70 * Math.max(0, 1 - e.y / ty);
      if (e.y >= ty) { e.y = ty; e.x = tx; e.st = 'form'; }
    } else if (e.st === 'form') {
      e.x += (tx - e.x) * Math.min(1, dt * 4); e.y += (ty - e.y) * Math.min(1, dt * 4);
      if (e.k === 3) e.morph = 0;
    } else if (e.st === 'under') {
      e.y -= 150 * sp * dt;
      e.x += Math.sin(e.t * 4) * 50 * dt;
      if (e.y <= ty) { e.y = ty; e.st = 'form'; }
    } else if (e.st === 'dive') {
      dive(e, sp, dt);
      if (e.y > H + 30) reenter(e);
      if (e.x < 12) { e.x = 12; e.dir = 1; }
      if (e.x > W - 12) { e.x = W - 12; e.dir = -1; }
    }
    // El peine de las oleadas 5-6 se desvanece y reaparece mientras pica.
    if (e.k === 2 && e.st === 'dive') {
      const ph = Math.sin(e.t * 2.2);
      const nv = ph < -0.35 ? 0 : ph < 0 ? 0.5 : 1;
      if (nv !== e.vis && nv === 0) sfx.phase();
      e.vis = nv;
    } else e.vis = 1;

    if (P.alive && P.inv <= 0 && e.vis === 1 && Math.abs(e.x - P.x) < shipHW() + hwOf(e) - 8 && Math.abs(e.y - P.y) < shipH() / 2 + hhOf(e) - 6) {
      hurt(e); hitPlayer();
    }
  }

  // Lanzamiento de picados
  diveT -= dt;
  if (diveT <= 0 && k !== 4) {
    diveT = (1.1 + Math.random() * 1.4) / d;
    const f = enemies.filter(e => e.st === 'form');
    if (f.length) {
      const e = f[Math.floor(Math.random() * f.length)];
      e.st = 'dive'; e.t = 0; e.dir = e.hx > 0 ? -1 : 1; e.vx = e.dir * 60;
      // Las moscas pican en enjambre: se lleva de paso al compañero más cercano.
      if (k === 1) {
        const mate = f.filter(o => o !== e).sort((a, b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y))[0];
        if (mate) { mate.st = 'dive'; mate.t = -0.15; mate.dir = e.dir; mate.vx = e.dir * 60; }
      }
    }
  }
  // Disparo enemigo: los meteoritos y los misiles no disparan, embisten.
  fireT -= dt;
  if (fireT <= 0 && k < 3 && ebul.length < 5 + round) {
    fireT = (0.55 + Math.random() * 0.9) / d;
    const f = enemies.filter(e => e.y < P.y - 90 && e.vis === 1);
    if (f.length && P.alive) {
      const e = f[Math.floor(Math.random() * f.length)];
      const sp = 215 + 35 * d;
      ebul.push({ x: e.x, y: e.y + 14, vx: (P.x - e.x) * (e.st === 'dive' ? 0.3 : 0.12), vy: sp }); sfx.enemyShoot();
    }
  }
  enemies = enemies.filter(e => e.hp > 0);
}

// Cada pareja de oleadas pica a su manera.
function dive(e, sp, dt) {
  if (e.k === 0) {                         // partible / mitad: arco amplio hacia el jugador
    e.x += e.dir * 105 * sp * dt + Math.sin(e.t * 2.1) * 40 * dt;
    e.y += 112 * sp * dt;
  } else if (e.k === 1) {                  // mosca: zigzag nervioso
    e.x += Math.sin(e.t * 6.5) * 150 * dt + e.dir * 55 * sp * dt;
    e.y += 125 * sp * dt;
  } else if (e.k === 2) {                  // peine: rápido y con corrección hacia la nave
    e.x += (P.alive ? Math.sign(P.x - e.x) : e.dir) * 95 * sp * dt + Math.sin(e.t * 3) * 60 * dt;
    e.y += 165 * sp * dt;
  } else if (e.k === 3) {                  // misil: se queda un instante quieto, se transforma y cae a plomo
    e.morph = Math.min(1, e.t / 0.5);
    if (e.morph < 1) { e.x += (P.alive ? (P.x - e.x) * 1.8 : 0) * dt; e.y += 25 * dt; }
    else e.y += 300 * sp * dt;
  }
}

// ---------- Dibujo ----------
function text(s, x, y, size, col = '#fff', align = 'center') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawEnemy(e) {
  const fr = Math.floor(T * 7 + e.flap) % 2;
  if (e.vis === 0) return;
  if (e.vis < 1 && Math.floor(T * 20) % 2) return;
  let c;
  if (e.k === 0) c = e.half ? (e.half < 0 ? spr.halfL[fr] : spr.halfR[fr]) : spr.split[fr];
  else if (e.k === 1) c = spr.fly[fr];
  else if (e.k === 2) c = spr.fan[fr];
  else if (e.k === 3) c = e.morph >= 1 ? spr.mis : spr.pod;
  else c = spr.rock[fr];
  drawSpr(c, e.x, e.y);
}
function drawShip(x, y, n, flame) {
  drawSpr(spr.f[n - 1], x, y);
  if (flame) {
    ctx.fillStyle = Math.random() < 0.5 ? '#fc2' : '#f62';
    const fx = Math.round(x / PX) * PX - PX / 2, fy = y + spr.f[n - 1].height * PX / 2 - PX;
    ctx.fillRect(fx - PX * 2, fy, PX, PX * (1 + (Math.random() * 3 | 0)));
    ctx.fillRect(fx + PX * 2, fy, PX, PX * (1 + (Math.random() * 3 | 0)));
  }
}

// Guía de acoplamiento: un pasillo del ancho exacto del margen que baja del segmento al morro.
// Verde mientras encajas, rojo cuando te sales; el morro lleva su propia marca para leer la desviación.
function dockGuide(cx, top) {
  const nose = P.y - shipH() / 2, ok = Math.abs(P.x - cx) <= DOCK_TOL;
  const col = ok ? '#3f6' : '#e55', gx = Math.round(cx / PX) * PX, px = Math.round(P.x / PX) * PX;
  if (nose > top) {
    ctx.fillStyle = ok ? 'rgba(60,255,120,.15)' : 'rgba(230,85,85,.07)';
    ctx.fillRect(gx - DOCK_TOL, top, DOCK_TOL * 2, nose - top);
    // Raíles a trazos que descienden, para que se lea como un carril y no como dos palos.
    ctx.fillStyle = col;
    const off = Math.round((T * 45 % 21) / PX) * PX;
    for (let y = top + off; y < nose; y += 21)
      for (const o of [-DOCK_TOL, DOCK_TOL - PX]) ctx.fillRect(gx + o, Math.round(y / PX) * PX, PX, Math.min(PX * 3, nose - y));
  }
  // Punta de flecha bajo el segmento, apuntando a la entrada del pasillo.
  ctx.fillStyle = col;
  for (let i = 0; i < 4; i++) ctx.fillRect(gx - (3 - i) * PX, top + PX + i * PX, ((3 - i) * 2 + 1) * PX, PX);
  // Marca del morro: una T que señala dónde estás tú.
  ctx.fillRect(px - PX / 2, nose - PX * 4, PX, PX * 4);
  ctx.fillRect(px - PX * 2 - PX / 2, nose - PX * 4, PX * 5, PX);
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) drawStar(s);

  if (state === 'title') {
    logo(W / 2, 150);
    text('VERSION WEB', W / 2, 212, 8, '#f93');
    const fr = Math.floor(T * 6) % 2;
    drawSpr(spr.split[fr], 58, 268); drawSpr(spr.fly[fr], 152, 268); drawSpr(spr.fan[fr], 242, 268);
    drawSpr(spr.pod, 330, 266); drawSpr(spr.rock[fr], 420, 268);
    text('50', 58, 300, 8, '#ff4ad0'); text('30', 152, 300, 8, '#39f0ff'); text('60', 242, 300, 8, '#9d7bff');
    text('100', 330, 300, 8, '#ff2a6a'); text('200', 420, 300, 8, '#b8864a');
    text('MOVER  FLECHAS / A D', W / 2, 344, 8);
    text('DISPARO Y RETROCOHETE  ESPACIO', W / 2, 366, 8);
    text('P PAUSA   M SONIDO   C CRT', W / 2, 388, 8);
    text('NIVEL  < ' + SKILL_NAME[skill] + ' >', W / 2, 424, 12, '#ff0');
    // Las dos opciones que no están en la recreativa, cada una con su tecla.
    text('BARRERA (E)  ' + (shieldOpt ? 'SI - ABAJO/SHIFT' : 'NO'), W / 2, 450, 10, shieldOpt ? '#5df' : '#789');
    text('CONSERVAR ACOPLE (R)  ' + (keepDock ? 'SI' : 'NO'), W / 2, 472, 10, keepDock ? '#5df' : '#789');
    if (Math.floor(T * 2) % 2 === 0) text('PULSA ENTER', W / 2, 510, 16, '#ff0');
    text('I  NAVES INFINITAS    D  ACOPLE EN BUCLE', W / 2, 536, 8, '#3e8');
    text('HI-SCORE ' + String(hi).padStart(6, '0'), W / 2, 560, 8, '#f55');
    drawShip(W / 2, 600, 3, true);
    return finish();
  }

  for (const e of enemies) drawEnemy(e);
  for (const b of shots) { const x = Math.round(b.x / PX) * PX - PX / 2; ctx.fillStyle = '#fff'; ctx.fillRect(x, b.y - 9, PX, 18); ctx.fillStyle = '#fd6'; ctx.fillRect(x, b.y + 3, PX, 6); }
  for (const b of ebul) {
    const x = Math.round(b.x / PX) * PX, y = Math.round(b.y / PX) * PX, c = Math.floor(T * 12) % 2 ? '#ff0' : '#f6a';
    ctx.fillStyle = c; ctx.fillRect(x - PX, y, PX * 3, PX); ctx.fillRect(x, y - PX, PX, PX * 3); ctx.fillStyle = '#fff'; ctx.fillRect(x, y, PX, PX);
  }

  if (state === 'dock' && dock && dock.done === 0) {
    const seg = spr.s[dock.seg];
    drawSpr(seg, dock.x, 230);
    dockGuide(dock.x, 230 + seg.height * PX / 2);
  }

  if (P && P.alive && (P.inv <= 0 || Math.floor(T * 14) % 2 === 0)) drawShip(P.x, P.y, parts, state === 'dock' ? inFire() : true);
  if (P && P.alive && P.shOn) {
    // Cúpula de puntos que centellea, como la de Phoenix, ajustada al tamaño de la nave acoplada.
    const cx = Math.round(P.x / PX) * PX, cy = Math.round(P.y / PX) * PX;
    const rx = shipHW() + 12, ry = shipH() / 2 + 10, n = 28 + parts * 10;
    for (let k = 0; k < n; k++) {
      const a = k / n * 6.283 + T * 5, w = 1 + Math.sin(T * 22 + k * 2) * 0.1;
      ctx.fillStyle = (k + Math.floor(T * 28)) % 3 ? '#5cf' : '#fff';
      ctx.fillRect(Math.round((cx + Math.cos(a) * rx * w) / PX) * PX, Math.round((cy + Math.sin(a) * ry * w) / PX) * PX, PX, PX);
    }
  }
  for (const p of parts_) { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x / PX) * PX, Math.round(p.y / PX) * PX, PX, PX); }
  for (const q of pops) text(q.text, q.x, q.y, 14, '#ffe400', 'left');

  // HUD
  text('SCORE1', 12, 18, 13, '#3e8', 'left'); text(String(score).padStart(6, '0'), 12, 36, 13, '#e22', 'left');
  text('HI-SCORE', W / 2, 18, 13, '#3ee'); text(String(hi).padStart(6, '0'), W / 2, 36, 13, '#e22');
  text('SCORE2', W - 12, 18, 13, '#3e8', 'right'); text('000000', W - 12, 36, 13, '#e22', 'right');
  text('RONDA ' + (round + 1) + '  OLEADA ' + (waveIdx + 1) + '  ' + SKILL_NAME[skill], W / 2, H - 10, 8, '#f93');
  // Segmentos en reserva, dibujados como coheticos
  const res = infinite ? 3 : Math.max(0, stack - (keepDock ? 1 : parts));
  if (!dockLoop) {                          // en el bucle de prueba ese rincón lo ocupa la telemetría
    for (let i = 0; i < Math.min(res, 6); i++) drawSpr(spr.icon, 20 + i * 22, H - 28);
    if (infinite) text('∞', 20, H - 22, 14, '#3e8', 'left');
  }

  if (shieldOpt && P && state !== 'dock') {
    const ready = P.shOn ? P.shT / SH_TIME : P.cool > 0 ? 1 - P.cool / SH_COOL : 1;
    ctx.fillStyle = '#123'; ctx.fillRect(W - 112, H - 32, 100, 10);
    ctx.fillStyle = P.shOn ? '#fff' : P.cool > 0 ? '#f44' : '#5df'; ctx.fillRect(W - 112, H - 32, 100 * ready, 10);
    text('BARRERA', W - 12, H - 40, 8, '#8ad', 'right');
  }
  if (state === 'dock' && dock) {
    const f = dock.time / 30;
    ctx.fillStyle = '#311'; ctx.fillRect(W - 132, H - 32, 120, 10);
    ctx.fillStyle = f > 0.4 ? '#3f6' : f > 0.2 ? '#fd0' : '#f44'; ctx.fillRect(W - 132, H - 32, 120 * f, 10);
    text(Math.ceil(dock.time) + 's  x' + dock.mult, W - 12, H - 40, 8, '#8ad', 'right');
    if (dockLoop) {
      // Telemetría para afinar el margen: desviación actual y altura que falta hasta el enganche.
      const dv = Math.round(P.x - dock.x), seg = spr.s[dock.seg];
      text('PRUEBA ' + (dockCycle + 1) + '/3   ' + (parts === 1 ? 'I' : 'I+II') + ' CON ' + (dock.seg ? 'III' : 'II'), 12, H - 54, 8, '#fd0', 'left');
      text('DESV ' + (dv > 0 ? '+' : '') + dv + ' px   MARGEN ±' + DOCK_TOL, 12, H - 40, 8, Math.abs(dv) <= DOCK_TOL ? '#3f6' : '#d55', 'left');
      text('SUBIR ' + Math.max(0, Math.round(P.y - shipH() / 2 - (230 + seg.height * PX / 2))) + ' px', 12, H - 26, 8, '#8ad', 'left');
      text('ENTER PARA SALIR', W - 12, H - 54, 8, '#8ad', 'right');
    }
  }

  if (msgT > 0) text(msg, W / 2, 400, msg.length > 14 ? 14 : 20, '#ff0');
  if (state === 'paused') { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); text('PAUSA', W / 2, 330, 32); }
  if (state === 'over' || (stack <= 0 && overT > 0)) {
    text('GAME OVER', W / 2, 310, 32, '#f33');
    if (state === 'over') { text('PUNTOS ' + score, W / 2, 360, 16); if (overT <= 0 && Math.floor(T * 2) % 2 === 0) text('PULSA ENTER', W / 2, 410, 16, '#ff0'); }
  }
  finish();
}

// Rótulo en bloque rojo y amarillo, como el de la portada.
function logo(cx, cy) {
  text('MOON', cx + 4, cy + 4, 46, '#7a0010'); text('MOON', cx, cy, 46, '#e01020');
  ctx.save(); ctx.beginPath(); ctx.rect(0, cy - 34, W, 16); ctx.clip(); text('MOON', cx, cy, 46, '#ffd23a'); ctx.restore();
  text('CRESTA', cx + 4, cy + 54, 46, '#7a0010'); text('CRESTA', cx, cy + 50, 46, '#e01020');
  ctx.save(); ctx.beginPath(); ctx.rect(0, cy + 16, W, 16); ctx.clip(); text('CRESTA', cx, cy + 50, 46, '#ffd23a'); ctx.restore();
}

function finish() {
  if (!scan) return;
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  for (let y = 2; y < H; y += PX) ctx.fillRect(0, y, W, 1);
}

// ---------- Bucle ----------
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (state === 'title') T += dt;
  if (state !== 'paused') { if (state === 'play' || state === 'dock') prevState = state; update(dt); }
  draw();
  requestAnimationFrame(frame);
}
function resize() {
  const padH = matchMedia('(pointer:coarse)').matches ? 90 : 0;
  const s = Math.min(innerWidth / W, (innerHeight - padH) / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
addEventListener('resize', resize); resize();
requestAnimationFrame(frame);
</script>
